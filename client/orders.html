<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechMart | Orders & Workflow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm sticky-top">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
      <i class="bi bi-cpu-fill text-primary"></i> TechMart Admin Hub
    </a>
    <div class="navbar-nav ms-3 d-flex flex-row gap-2">
      <a class="nav-link px-3" href="index.html">Inventory</a>
      <a class="nav-link active px-3" href="orders.html">Orders & Workflow</a>
    </div>
    <span class="badge bg-primary ms-auto">2026 Enterprise Edition</span>
  </nav>

  <div class="container-fluid py-4 px-md-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="fw-bold mb-0">Order Lifecycle & Fulfillment</h2>
        <p class="text-muted small mb-0">Track transactions: Pending &rarr; Processing &rarr; Shipped &rarr; Delivered</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" onclick="loadOrders()">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createOrderModal">
          <i class="bi bi-cart-plus"></i> Simulate Customer Order
        </button>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3 border-0">
        <h5 class="fw-bold mb-0">Customer Transactions</h5>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Total ($)</th>
              <th>Workflow Stage</th>
              <th class="text-end">Update Stage</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <tr>
              <td colspan="6" class="text-center py-4 text-muted">
                <div class="spinner-border text-primary spinner-border-sm"></div> Loading orders...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal: Simulate Order -->
  <div class="modal fade" id="createOrderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Simulate New Customer Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="orderForm" onsubmit="handleCreateOrder(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input type="text" class="form-control" id="custName" value="Rahul Sharma" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Customer Email</label>
              <input type="email" class="form-control" id="custEmail" value="rahul@example.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Select Product</label>
              <select class="form-select" id="orderProductSelect" required>
                <!-- Populated dynamically -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Quantity</label>
              <input type="number" class="form-control" id="orderQty" min="1" value="1" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success">Place Order</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
